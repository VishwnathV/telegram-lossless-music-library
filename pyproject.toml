[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-lossless-music-library"
version = "0.2.0"
description = "Build a searchable, lossless-first music library from authorized Telegram sources"
readme = "README.md"
license = "MIT"
authors = [{ name = "VishwnathV" }]
keywords = ["telegram", "music-library", "lossless", "flac", "telethon", "fastapi"]
requires-python = ">=3.11"
dependencies = [
  "cryptg>=0.5,<1",
  "fastapi>=0.115,<1",
  "imageio-ffmpeg>=0.6,<1",
  "mutagen>=1.47,<2",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "telethon>=1.37,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
music-library = "music_library.cli:main"

[project.urls]
Homepage = "https://github.com/VishwnathV/telegram-lossless-music-library"
Repository = "https://github.com/VishwnathV/telegram-lossless-music-library"
Issues = "https://github.com/VishwnathV/telegram-lossless-music-library/issues"

[tool.setuptools.packages.find]
include = ["music_library*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
